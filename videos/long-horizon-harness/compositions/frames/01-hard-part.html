<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Inter-Regular.woff2") format("woff2");}
        @font-face{font-family:"Inter";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/Inter-Bold.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Bold.woff2") format("woff2");}

        #root{
          position:absolute; inset:0; width:1920px; height:1080px;
          container-type:size; overflow:hidden;
          color:#E9EEF6; font-family:"Inter", system-ui, sans-serif;
        }
        .hp-ground{ position:absolute; inset:0; background:#06080C; }
        .hp-sky{
          position:absolute; inset:0;
          background:
            radial-gradient(128% 86% at 50% 120%, rgba(126,176,204,0.13) 0%, rgba(126,176,204,0.05) 38%, rgba(6,8,12,0) 70%),
            radial-gradient(70% 52% at 50% 44%, rgba(233,238,246,0.035) 0%, rgba(6,8,12,0) 72%);
        }
        .hp-kicker{
          position:absolute; left:4.2cqw; top:4.2cqw;
          font-family:"JetBrains Mono", monospace; font-size:28px; font-weight:400;
          letter-spacing:0.16em; text-transform:uppercase;
          color:rgba(233,238,246,0.52);
        }
        .hp-kicker i{ color:#5CE1F2; font-style:normal; margin-right:0.6em; }
        .hp-stage{
          position:absolute; left:0; right:0; top:0; height:83%;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .hp-line{
          font-size:8.6cqw; font-weight:700; line-height:1.0; letter-spacing:-0.038em;
          max-width:90cqw; text-align:center; white-space:nowrap;
        }
        .hp-line-b{ margin-top:0.12em; }
        .hp-w{ display:inline-block; }
        .hp-tail{ position:relative; display:inline-block; }
        .hp-rule{
          position:absolute; left:0; right:0; bottom:-0.10em; height:4px;
          background:#5CE1F2; border-radius:2px; transform-origin:0% 50%;
        }
        .hp-glow{
          position:absolute; left:-6%; right:-6%; bottom:-0.34em; height:0.5em;
          background:radial-gradient(60% 100% at 50% 100%, rgba(92,225,242,0.42) 0%, rgba(92,225,242,0.10) 46%, rgba(92,225,242,0) 78%);
          filter:blur(18px); opacity:0; z-index:1;
        }
        .hp-tail .hp-w{ position:relative; z-index:2; }
      </style>

      <div id="root" data-composition-id="01-hard-part" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
        <div id="hp-ground" class="clip hp-ground" data-start="0" data-duration="4.5" data-track-index="0">
          <div class="hp-sky" id="hp-sky"></div>
        </div>

        <div class="hp-kicker" id="hp-kicker"><i>&#10033;</i>AGENT HARNESS</div>

        <div class="hp-stage" id="hp-stage">
          <div class="hp-line" id="hp-a"><span class="hp-w">The</span> <span class="hp-w">model</span> <span class="hp-w">was</span> <span class="hp-w">never</span></div>
          <div class="hp-line hp-line-b" id="hp-b"><span class="hp-w">the</span> <span class="hp-tail"><span class="hp-glow" id="hp-glow"></span><span class="hp-w">hard</span> <span class="hp-w">part.</span><span class="hp-rule" id="hp-rule"></span></span></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var ID = "01-hard-part";

          var aWords = document.querySelectorAll('#hp-a .hp-w');
          var bWords = document.querySelectorAll('#hp-b .hp-w');
          var rule = document.getElementById('hp-rule');
          var glow = document.getElementById('hp-glow');
          var kicker = document.getElementById('hp-kicker');
          var stage = document.getElementById('hp-stage');
          var sky = document.getElementById('hp-sky');

          // Scene 1 (0.0-1.3s) — "The model" lands word by word on the dark ground.
          tl.fromTo(sky, { opacity: 0.35 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0);
          tl.fromTo(aWords,
            { opacity: 0, yPercent: 26, filter: "blur(14px)" },
            { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out", stagger: 0.20 },
            0.12);

          // Scene 2 (1.3-2.6s) — the line completes as the voice reaches it.
          tl.fromTo(bWords,
            { opacity: 0, yPercent: 26, filter: "blur(14px)" },
            { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.82, ease: "power3.out", stagger: 0.19 },
            1.33);

          // Scene 3 (2.6-4.0s) — the one cyan moment: the rule draws, the glow blooms, then hold.
          tl.fromTo(rule,
            { scaleX: 0, opacity: 1 },
            { scaleX: 1, duration: 0.62, ease: "power3.out" },
            2.60);
          tl.fromTo(glow,
            { opacity: 0, scaleY: 0.72 },
            { opacity: 0.9, scaleY: 1, duration: 0.7, ease: "power2.out" },
            2.66);
          tl.fromTo(kicker,
            { opacity: 0, x: -14 },
            { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" },
            2.78);

          // Held read — the only sanctioned aliveness: bounded low-amplitude jitter.
          var jitter = { p: 0 };
          tl.to(jitter, {
            p: 1, duration: 0.8, ease: "none",
            onUpdate: function () {
              var s = Math.sin(jitter.p * Math.PI * 2);
              gsap.set(stage, { y: s * 1.1 });
            }
          }, 3.2);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
