<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Inter-Regular.woff2") format("woff2");}
        @font-face{font-family:"Inter";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/Inter-Bold.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"JetBrains Mono";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-Bold.woff2") format("woff2");}

        #root{
          position:absolute; inset:0; width:1920px; height:1080px;
          container-type:size; overflow:hidden;
          color:#E9EEF6; font-family:"Inter", system-ui, sans-serif;
        }
        .dr-ground{ position:absolute; inset:0; background:#06080C; }
        .dr-sky{
          position:absolute; inset:0;
          background:radial-gradient(84% 64% at 50% 78%, rgba(126,176,204,0.085) 0%, rgba(6,8,12,0) 70%);
        }
        .dr-night{ position:absolute; inset:0; background:#030407; opacity:0; }
        .dr-kicker{
          position:absolute; left:4.2cqw; top:4.2cqw;
          font-family:"JetBrains Mono", monospace; font-size:28px; letter-spacing:0.16em;
          text-transform:uppercase; color:rgba(233,238,246,0.52);
        }
        .dr-kicker i{ color:#5CE1F2; font-style:normal; margin-right:0.6em; }
        .dr-status{
          position:absolute; right:4.2cqw; top:4.2cqw;
          font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:0.12em;
          color:rgba(233,238,246,0.56); text-align:right;
        }
        .dr-row{
          position:absolute; left:200px; width:1520px; height:54px;
          border-top:1px solid rgba(233,238,246,0.10);
          display:flex; align-items:center;
          font-family:"JetBrains Mono", monospace; font-size:21px; letter-spacing:0.04em;
          color:rgba(233,238,246,0.62);
        }
        .dr-day{ width:96px; color:rgba(233,238,246,0.72); }
        .dr-tok{ opacity:1; }
        .dr-mem{
          position:absolute; width:11px; height:11px; border-radius:50%;
          background:rgba(233,238,246,0.54); top:22px;
        }
        .dr-scan{
          position:absolute; left:200px; top:404px; width:2px; height:400px;
          background:linear-gradient(180deg, rgba(233,238,246,0) 0%, rgba(233,238,246,0.55) 18%, rgba(233,238,246,0.55) 82%, rgba(233,238,246,0) 100%);
          opacity:0;
        }
        .dr-card{
          position:absolute; left:640px; top:186px; width:640px; height:150px;
          background:#161C26; border:1px solid rgba(233,238,246,0.12); border-radius:12px;
          box-shadow:0 1px 2px rgba(0,0,0,0.70), 0 18px 48px rgba(0,0,0,0.45);
          padding:24px 28px;
        }
        .dr-card b{
          display:block; font-family:"JetBrains Mono", monospace; font-size:20px;
          letter-spacing:0.14em; font-weight:400; color:rgba(233,238,246,0.50); margin-bottom:12px;
        }
        .dr-card p{ font-size:30px; font-weight:400; line-height:1.35; color:rgba(233,238,246,0.92); }
        .dr-lead{ position:absolute; inset:0; }
      </style>

      <div id="root" data-composition-id="06-it-dreams" data-start="0" data-duration="12.4" data-width="1920" data-height="1080">
        <div id="dr-ground" class="clip dr-ground" data-start="0" data-duration="12.4" data-track-index="0">
          <div class="dr-sky"></div>
          <div class="dr-night" id="dr-night"></div>
        </div>

        <div class="dr-kicker" id="dr-kicker"><i>&#10033;</i>SELF-IMPROVEMENT LOOP</div>
        <div class="dr-status" id="dr-status">SESSIONS &#183; THIS WEEK</div>

        <div class="dr-row" id="dr-r1" style="top:430px;"><span class="dr-day">MON</span><span class="dr-tok">bigquery ngrams &#183; write_file &#183; terminal</span></div>
        <div class="dr-row" id="dr-r2" style="top:506px;"><span class="dr-day">TUE</span><span class="dr-tok">deploy review &#183; load_skill &#183; terminal</span></div>
        <div class="dr-row" id="dr-r3" style="top:582px;"><span class="dr-day">WED</span><span class="dr-tok">research digest &#183; web &#183; write_file</span></div>
        <div class="dr-row" id="dr-r4" style="top:658px;"><span class="dr-day">THU</span><span class="dr-tok">schema check &#183; terminal &#183; report</span></div>
        <div class="dr-row" id="dr-r5" style="top:734px;"><span class="dr-day">FRI</span><span class="dr-tok">cost audit &#183; bq &#183; write_file</span></div>

        <div class="dr-mem" id="dr-m1" style="left:706px; top:452px;"></div>
        <div class="dr-mem" id="dr-m2" style="left:980px; top:528px;"></div>
        <div class="dr-mem" id="dr-m3" style="left:1204px; top:604px;"></div>
        <div class="dr-mem" id="dr-m4" style="left:864px; top:680px;"></div>
        <div class="dr-mem" id="dr-m5" style="left:1418px; top:756px;"></div>

        <div class="dr-scan" id="dr-scan"></div>

        <svg class="dr-lead" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <path id="dr-path" d="M 712 452 C 712 400, 800 372, 900 344" fill="none" stroke="#5CE1F2" stroke-width="2.2" vector-effect="non-scaling-stroke" opacity="0"/>
        </svg>

        <div class="dr-card" id="dr-card">
          <b>CONSOLIDATED &#183; 1 PROFILE</b>
          <p>prefers BigQuery over CSV exports</p>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var ID = "06-it-dreams";

          var rows = ['dr-r1', 'dr-r2', 'dr-r3', 'dr-r4', 'dr-r5'].map(function (i) { return document.getElementById(i); });
          var mems = ['dr-m1', 'dr-m2', 'dr-m3', 'dr-m4', 'dr-m5'].map(function (i) { return document.getElementById(i); });
          var scan = document.getElementById('dr-scan');
          var card = document.getElementById('dr-card');
          var lead = document.getElementById('dr-path');
          var night = document.getElementById('dr-night');
          var status = document.getElementById('dr-status');
          var kicker = document.getElementById('dr-kicker');

          gsap.set(rows, { opacity: 0, x: -26 });
          gsap.set(mems, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" });
          gsap.set(card, { opacity: 0, y: 250, scale: 0.94, transformOrigin: "50% 100%" });
          gsap.set(lead, { attr: { "stroke-dasharray": 130, "stroke-dashoffset": 130 }, opacity: 0 });

          // Scene 1 (0.0-2.3s) — the week arrives as five faint session rows.
          tl.fromTo(kicker, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.10);
          tl.fromTo(rows,
            { opacity: 0, x: -26 },
            { opacity: 1, x: 0, duration: 0.68, ease: "power3.out", stagger: 0.16 },
            0.20);
          tl.fromTo(mems,
            { opacity: 0, scale: 0.2 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", stagger: 0.16 },
            0.55);

          // Scene 2 (2.3-4.4s) — nightfall: the ground darkens and the pass starts running.
          tl.to(night, { opacity: 0.46, duration: 1.3, ease: "power2.inOut" }, 2.30);

          // Status strip — a discrete text sequence driven purely by timeline time, so a
          // seek in either direction lands on the correct state (no callbacks).
          var STATES = [
            { at: 0.0, text: "SESSIONS · THIS WEEK" },
            { at: 2.55, text: "NIGHTLY PASS · RUNNING" },
            { at: 10.2, text: "SURFACED" }
          ];
          var clock = { t: 0 };
          tl.to(clock, {
            t: 12, duration: 12, ease: "none",
            onUpdate: function () {
              var s = STATES[0];
              for (var k = STATES.length - 1; k >= 0; k--) {
                if (clock.t >= STATES[k].at) { s = STATES[k]; break; }
              }
              if (status.textContent !== s.text) status.textContent = s.text;
            }
          }, 0);

          tl.fromTo(scan, { opacity: 0, x: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.60);
          tl.fromTo(scan, { x: 0 }, { x: 1516, duration: 3.6, ease: "none" }, 2.70);

          // Scene 3 (4.4-6.3s) — every row the scan crosses brightens, then settles back.
          var brightAt = [3.30, 4.00, 4.55, 3.75, 5.10];
          rows.forEach(function (r, i) {
            tl.to(r, { color: "rgba(233,238,246,0.88)", duration: 0.22, ease: "power2.out" }, brightAt[i]);
            tl.to(r, { color: "rgba(233,238,246,0.62)", duration: 0.9, ease: "power2.out" }, brightAt[i] + 0.3);
            tl.to(mems[i], { scale: 1.5, duration: 0.2, ease: "power2.out" }, brightAt[i]);
            tl.to(mems[i], { scale: 1, duration: 0.7, ease: "power2.out" }, brightAt[i] + 0.24);
          });
          tl.to(scan, { opacity: 0, duration: 0.4, ease: "power2.out" }, 6.05);

          // Scene 4 (6.3-8.7s) — the receipt: one consolidated memory rises out of Monday.
          tl.fromTo(card,
            { opacity: 0, y: 250, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 1.35, ease: "power3.out" },
            6.30);

          // Scene 5 (8.7-10.0s) — the one cyan moment: the leader draws Monday -> the card.
          tl.set(lead, { opacity: 1 }, 8.70);
          tl.to(lead, { attr: { "stroke-dashoffset": 0 }, duration: 0.75, ease: "power2.out" }, 8.70);
          tl.fromTo(card,
            { boxShadow: "0 1px 2px rgba(0,0,0,0.70), 0 18px 48px rgba(0,0,0,0.45)" },
            { boxShadow: "0 0 30px rgba(92,225,242,0.26), 0 18px 48px rgba(0,0,0,0.45)", duration: 0.7, ease: "power2.out" },
            9.00);

          // Scene 6 (10.0-12.0s) — Friday brightens under the card; status flips; hold.
          tl.to(rows[4], { color: "rgba(233,238,246,0.72)", duration: 0.5, ease: "power2.out" }, 10.05);
          tl.to(mems[4], { backgroundColor: "rgba(233,238,246,0.86)", scale: 1.25, duration: 0.4, ease: "power2.out" }, 10.10);
          var jitter = { p: 0 };
          tl.to(jitter, {
            p: 1, duration: 1.6, ease: "none",
            onUpdate: function () { gsap.set(card, { y: Math.sin(jitter.p * Math.PI * 2) * 1.3 }); }
          }, 10.40);

          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
