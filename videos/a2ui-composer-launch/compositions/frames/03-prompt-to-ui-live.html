    4.32, 4.60, 4.88,                                          /* G2 - Text h2      */

    while (i < line.length) {

        j = i + 1;
        while (j < line.length && line.charAt(j) !== '"') j++;
        k = j + 1;
        while (k < line.length && line.charAt(k) === " ") k++;
        isKey = line.charAt(k) === ":";
        out += '<i style="color:' + (isKey ? K : S) + '">' + esc(line.slice(i, j + 1)) + "</i>";

    onUpdate: function () { ptext.textContent = PROMPT.substring(0, Math.floor(typer.v)); }
  }, 0.85);

  /* --- Scene 3 (3.0-3.4) : SEND presses, ripple ignites, caret zoom-through --- */
  tl.to("#p3-send", { scale: 0.88, duration: 0.09, ease: "power2.in" }, 3.00);
  tl.to("#p3-send", { scale: 1, duration: 0.42, ease: "power3.out" }, 3.09);
  tl.fromTo(["#p3-vr1", "#p3-vr2"],
    { scale: 0.10, opacity: 0.85 },
    { scale: 1.6, opacity: 0, duration: 0.62, ease: "power2.out", stagger: 0.08, immediateRender: false }, 3.05);

  /* the caret leaves the assistant … */
  tl.to("#p3-acaret", { scale: 3.2, filter: "blur(7px)", opacity: 0, duration: 0.16, ease: "power4.in" }, 3.10);
  /* … and arrives in the editor gutter, matched direction + velocity, cut at peak */
  tl.fromTo("#p3-ecaret",
    { scale: 3.2, filter: "blur(7px)", opacity: 0 },
    { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.20, ease: "power4.out", immediateRender: false }, 3.26);

  /* --- Scene 4 (3.4-9.0) : THE SIGNATURE STRETCH --- */
  for (var r = 0; r < rows.length; r++) {
    tl.fromTo(rows[r], { opacity: 0, x: -6 },
      { opacity: 1, x: 0, duration: 0.14, ease: "power2.out" }, T[r]);
  }

  /* editor scroll + caret follow (deterministic, driven off absolute time) */
  function smooth(u) { return u * u * (3 - 2 * u); }
  var drv = { t: 3.30 };
  tl.fromTo(drv, { t: 3.30 }, {
    t: 14.0, duration: 10.70, ease: "none",
    onUpdate: function () {
      var t = drv.t, shown = 0, n;
      for (n = 0; n < T.length; n++) { if (t >= T[n]) shown = n + 1; }
      var prev = Math.max(0, shown - 1 - VISIBLE) * LH;
      var cur = Math.max(0, shown - VISIBLE) * LH;
      var u = shown > 0 ? Math.min(1, Math.max(0, (t - T[shown - 1]) / 0.22)) : 1;
      scroll.style.transform = "translateY(" + (-(prev + (cur - prev) * smooth(u))).toFixed(2) + "px)";
      var li = shown > 0 ? shown - 1 : 0;
      var len = shown > 0 ? LINES[li].length : 0;
      caretE.style.left = (CODE_X + len * CW).toFixed(2) + "px";
      caretE.style.top = (PAD + li * LH + 4) + "px";
    }
  }, 3.30);

  /* G1 - the Card frame draws its outline stroke-by-stroke */
  var cp = q("#p3-cardpath");
  var plen = cp.getTotalLength();
  cp.style.strokeDasharray = plen;
  cp.style.strokeDashoffset = plen;
  tl.fromTo(cp, { strokeDashoffset: plen }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 3.70);
  tl.fromTo("#p3-card-bg", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power2.out" }, 3.98);
  tl.to("#p3-card-outline", { opacity: 0, duration: 0.30, ease: "power1.out" }, 4.20);

  /* G2..G6 - each component lands on the beat its own lines finish streaming */
  tl.fromTo("#p3-title", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 4.90);
  tl.fromTo("#p3-caption", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 5.70);
  tl.fromTo("#p3-rule", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.34, ease: "power3.out" }, 6.45);
  var SEATS = ["#p3-seat0", "#p3-seat1", "#p3-seat2"];
  for (var s2 = 0; s2 < 3; s2++) {
    tl.fromTo(SEATS[s2], { opacity: 0, scale: 0.86 },
      { opacity: 1, scale: 1, duration: 0.38, ease: "power3.out" }, 7.15 + s2 * 0.12);
  }
  tl.fromTo("#p3-btn", { opacity: 0, scale: 0.90 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 8.20);

  /* every component's FIRST FRAME takes a mint bloom that decays to nothing in 0.4s */
  var BLOOMS = [
    ["#p3-bl-card", 4.10], ["#p3-bl-title", 4.90], ["#p3-bl-cap", 5.70], ["#p3-bl-rule", 6.45],
    ["#p3-bl-s0", 7.15], ["#p3-bl-s1", 7.27], ["#p3-bl-s2", 7.39], ["#p3-bl-btn", 8.20]
  ];
  for (var b = 0; b < BLOOMS.length; b++) {
    tl.fromTo(BLOOMS[b][0], { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, BLOOMS[b][1]);
    tl.to(BLOOMS[b][0], { opacity: 0, duration: 0.34, ease: "power2.in" }, BLOOMS[b][1] + 0.06);
  }

  /* --- Scene 5 (9.0-11.4) : RENDERED, the cursor, the tap, the round trip --- */
  tl.fromTo("#p3-chip", { opacity: 0, scale: 0 },
    { opacity: 1, scale: 1, duration: 0.50, ease: "power3.out" }, 9.10);

  tl.fromTo("#p3-cursor", { x: 1400 }, { x: 0, duration: 0.73, ease: "power3.out" }, 9.05);
  tl.fromTo("#p3-cursor", { y: 640 }, { y: 0, duration: 0.80, ease: "power2.out" }, 9.05);
  tl.to("#p3-cursor", { scale: 0.86, duration: 0.08, ease: "power2.in" }, 9.90);
  tl.to("#p3-cursor", { scale: 1, duration: 0.30, ease: "power3.out" }, 9.98);
  tl.to("#p3-btn", { scale: 0.94, duration: 0.09, ease: "power2.in" }, 9.90);
  tl.to("#p3-btn", { scale: 1, duration: 0.44, ease: "power3.out" }, 9.99);
  tl.fromTo(["#p3-sr1", "#p3-sr2"],
    { scale: 0.10, opacity: 0.8 },
    { scale: 1.5, opacity: 0, duration: 0.70, ease: "power2.out", stagger: 0.08, immediateRender: false }, 9.92);

  /* EVENTS becomes the active tab on the tap */
  tl.fromTo("#p3-tab0 .p3-tab-hl", { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power2.out" }, 9.90);
  tl.fromTo("#p3-tab0 .p3-tab-tx", { color: "#EDF1F8" }, { color: "#8A93A6", duration: 0.24, ease: "power2.out" }, 9.90);
  tl.fromTo("#p3-tab1 .p3-tab-hl", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, 9.90);
  tl.fromTo("#p3-tab1 .p3-tab-tx", { color: "#8A93A6" }, { color: "#EDF1F8", duration: 0.24, ease: "power2.out" }, 9.90);

  /* the event row writes itself back — the round trip to the agent */
  var EV = "rebook_flight", TS = "  ·  18:24:41.208";
  var evn = q("#p3-evname"), evt = q("#p3-evtime");
  var w1 = { v: 0 }, w2 = { v: 0 };
  tl.fromTo(w1, { v: 0 }, {
    v: EV.length, duration: 0.30, ease: "none",
    onUpdate: function () { evn.textContent = EV.substring(0, Math.floor(w1.v)); }
  }, 9.98);
  tl.fromTo(w2, { v: 0 }, {
    v: TS.length, duration: 0.32, ease: "none",
    onUpdate: function () { evt.textContent = TS.substring(0, Math.floor(w2.v)); }
  }, 10.28);

  /* --- Scene 6 (11.4-14.0) : held read. Only the editor caret blinks (even frames). --- */
  var blink = { t: 3.26 };
  tl.fromTo(blink, { t: 3.26 }, {
    t: 14.0, duration: 10.74, ease: "none",
    onUpdate: function () {
      /* solid while the payload is still streaming; 1.6Hz blink once it lands */
      if (blink.t < 8.85) { caretB.style.opacity = "1"; return; }
      var f = Math.round(blink.t * 30) / 30;
      caretB.style.opacity = (Math.floor(f / 0.3125) % 2 === 0) ? "1" : "0";
    }
  }, 3.26);
})();
</script>
</template>
