            <div class="wb4-tab" id="wb4-tab-1" style="left:226px;width:96px"><span id="wb4-tt-1"></span></div>
            <div class="wb4-tab" id="wb4-tab-2" style="left:366px;width:96px"><span id="wb4-tt-2"></span></div>
            <div class="wb4-tab" id="wb4-tab-3" style="left:506px;width:176px"><span id="wb4-tt-3"></span></div>
            <div class="wb4-ul" id="wb4-scanline"></div>
            <div class="wb4-ul" id="wb4-activeline"></div>
          </div>
          <div id="wb4-tree">
            <div class="row path">/booking</div>
            <div class="row"><span class="p">  </span><span class="k">"flight"</span><span class="p">: </span><span class="v">"AA 2417"</span></div>
            <div class="row"><span class="p">  </span><span class="k">"seat"</span><span class="p">: </span><span class="v" id="wb4-seatval">"14A"</span></div>

        <!-- two-way binding hairline: data-model row -> preview chip -->
        <svg id="wb4-linksvg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <path id="wb4-link" d="M 722 829 H 849 V 411" />
        </svg>

      </div>

    <div id="wb4-chrome" class="clip" data-start="0" data-duration="10.5" data-track-index="2">
      <div class="wb4-strip" id="wb4-strip-l" data-layout-allow-overlap>A2UI · Agent-driven interfaces</div>
    </div>
    <!-- injected by scripts/chassis.mjs — the film's editorial chassis -->
    <div id="f04c-chassis" class="clip" data-start="0" data-duration="10.5" data-track-index="3" data-layout-allow-overlap>
      <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
      <div id="f04c-toprail"><span>A2UI.ORG/COMPOSER</span></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-the-workbench"] = tl;

      var q = function (s) { return document.querySelector(s); };

      /* =========================================================
         CAMERA — one world wrapper, T = -offset x S (viewport-change)
         Scene 1 opens punched in on the editor; Scene 2 is ONE
         unbroken decelerating pull-back. No zoom-in, ever.
         ========================================================= */
      var world = q("#wb4-world");
      var S0 = 3.4, S1 = 1.0;        // camera scale: tight -> workbench
      var FX0 = 1566, FY0 = 320;     // world point held at screen centre, t=0
      var FX1 = 960,  FY1 = 540;     // world point held at screen centre, t>=5.6
      var camProg = { p: 0 };
      var camHold = { v: 0 };

      function applyCamera() {
        var p = camProg.p;
        var s = S0 * Math.pow(S1 / S0, p);
        var fx = FX0 + (FX1 - FX0) * p;
        var fy = FY0 + (FY1 - FY0) * p;
        var tx = -(fx - 960) * s;
        var ty = -(fy - 540) * s;
        world.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + s + ")";
      }
      applyCamera();

      /* Scene 1 (0.0-1.6): locked at S0. Held by a driver so any seek re-seeds it. */
      tl.to(camHold, { v: 1, duration: 1.6, ease: "none", onUpdate: applyCamera }, 0);
      /* Scene 2 (1.6-5.6): the single long-tail decelerating pull-back. */
      tl.fromTo(
        camProg,
        { p: 0 },
        { p: 1, duration: 4.0, ease: "power1.out", onUpdate: applyCamera },
        1.6
      );

      /* =========================================================
         Panel labels type on as their panel enters frame
         (discrete-text-sequence, smooth-slice variation)
         ========================================================= */
      function typeOn(sel, text, start, dur) {
        var el = q(sel);
        var st = { v: 0 };
        tl.fromTo(
          st,
          { v: 0 },
          {
            v: text.length, duration: dur, ease: "power1.inOut",
            onUpdate: function () { el.textContent = text.slice(0, Math.round(st.v)); }
          },
          start
        );
      }
      typeOn("#wb4-lab-editor",  "A2UI JSON",        2.80, 0.40);
      typeOn("#wb4-lab-preview", "RENDERED PREVIEW", 3.10, 0.58);
      typeOn("#wb4-lab-gemini",  "GEMINI ASSISTANT", 3.60, 0.58);
      typeOn("#wb4-tt-0", "DATA MODEL",   3.95, 0.32);
      typeOn("#wb4-tt-1", "EVENTS",       4.07, 0.32);
      typeOn("#wb4-tt-2", "ERRORS",       4.19, 0.32);
      typeOn("#wb4-tt-3", "RAW MESSAGES", 4.31, 0.32);

      /* =========================================================
         Scene 3 (5.6-7.0) — the four tabs light one at a time.
         One linear driver, per-tab attack/sustain/release envelope
         (asr-keyword-glow, karaoke colour form; no glow — light
         discipline forbids a bloom on content).
         ========================================================= */
      var TABS = [q("#wb4-tab-0"), q("#wb4-tab-1"), q("#wb4-tab-2"), q("#wb4-tab-3")];
      var TAB_T = [
        { s: 5.70, e: 7.55 },  /* DATA MODEL stays lit — it is the active tab */
        { s: 6.10, e: 6.35 },
        { s: 6.50, e: 6.75 },
        { s: 6.90, e: 7.15 }
      ];
      var ATTACK = 0.12, RELEASE = 0.30, REST = 0.10;
      var REST_RGB = [163,171,187], ACTIVE_RGB = [237, 241, 248];

      function envelope(t, s, e) {
        if (t < s) return 0;
        if (t < e) return Math.min((t - s) / ATTACK, 1);
        var re = e + RELEASE;
        if (t < re) return 1 - ((t - e) / RELEASE) * (1 - REST);
        return REST;
      }
      function lerp(a, b, t) { return Math.round(a + (b - a) * t); }

      var tabDrive = { t: 5.55 };
      tl.fromTo(
        tabDrive,
        { t: 5.55 },
        {
          t: 7.60, duration: 2.05, ease: "none",
          onUpdate: function () {
            for (var i = 0; i < 4; i++) {
              var env = envelope(tabDrive.t, TAB_T[i].s, TAB_T[i].e);
              TABS[i].style.color =
                "rgb(" + lerp(REST_RGB[0], ACTIVE_RGB[0], env) + "," +
                lerp(REST_RGB[1], ACTIVE_RGB[1], env) + "," +
                lerp(REST_RGB[2], ACTIVE_RGB[2], env) + ")";
              TABS[i].style.backgroundColor = "rgba(27,33,48," + (env * 0.92).toFixed(3) + ")";
            }
          }
        },
        5.55
      );

      /* stream underline scanning left to right between the tabs */
      tl.fromTo("#wb4-scanline", { opacity: 0, x: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, 5.62);
      tl.to("#wb4-scanline", { x: 194, width: 96,  duration: 0.30, ease: "power3.out" }, 6.06);
      tl.to("#wb4-scanline", { x: 334, width: 96,  duration: 0.30, ease: "power3.out" }, 6.46);
      tl.to("#wb4-scanline", { x: 474, width: 176, duration: 0.30, ease: "power3.out" }, 6.86);
      tl.to("#wb4-scanline", { opacity: 0, duration: 0.16, ease: "power1.out" }, 7.04);
      /* the active tab commits — underline draws under DATA MODEL, no reversal */
      tl.fromTo("#wb4-activeline", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, 7.02);

      /* =========================================================
         Scene 4 (7.0-8.4) — the voltage moment. The Data Model
         value retypes 14A -> 22F and the preview chip follows in
         the same beat, joined by a live hairline drawn left to right.
         ========================================================= */
      var seatEl = q("#wb4-seatval");
      var SEQ = [
        { t: 0.00, x: '"14A"' },
        { t: 7.16, x: '"14A'  },
        { t: 7.25, x: '"14'   },
        { t: 7.34, x: '"1'    },
        { t: 7.43, x: '"'     },
        { t: 7.58, x: '"2'    },
        { t: 7.69, x: '"22'   },
        { t: 7.80, x: '"22F'  },
        { t: 7.90, x: '"22F"' }
      ];
      function seatAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) { if (time >= SEQ[i].t) return SEQ[i].x; }
        return SEQ[0].x;
      }

      var caretEl = q("#wb4-caret");
      var now = { t: 0 };
      tl.fromTo(
        now,
        { t: 0 },
        {
          t: 10, duration: 10, ease: "none",
          onUpdate: function () {
            seatEl.textContent = seatAt(now.t);
            /* the caret is the only element allowed to blink — 1.6Hz, deterministic */
            caretEl.style.opacity = Math.sin(now.t * Math.PI * 2 * 1.6) > 0 ? "1" : "0";
          }
        },
        0
      );

      /* the value's moment of change takes a brief mint accent, decaying inside 0.4s */
      tl.fromTo(
        "#wb4-seatval",
        { color: "#34E2C0" },
        { color: "#EDF1F8", duration: 0.38, ease: "power1.out", immediateRender: false },
        7.90
      );

      /* the preview's selected chip changes on the same beat */
      tl.to("#wb4-chip-14a", {
        backgroundColor: "rgba(237,241,248,0)", borderColor: "rgba(237,241,248,0.10)",
        color: "#A3ABBB", duration: 0.22, ease: "power2.out"
      }, 7.90);
      tl.to("#wb4-chip-22f", {
        backgroundColor: "rgba(237,241,248,0.14)", borderColor: "rgba(237,241,248,0.34)",
        color: "#EDF1F8", duration: 0.22, ease: "power2.out"
      }, 7.90);

      /* the binding hairline — measured draw, left to right, then gone (svg-path-draw) */
      var link = q("#wb4-link");
      var len = 545;
      if (link.getTotalLength) { var m = link.getTotalLength(); if (m > 1) len = m; }
      link.style.strokeDasharray = String(len);
      link.style.strokeDashoffset = String(len);
      tl.to(link, { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" }, 7.30);
      tl.to(link, { opacity: 0, duration: 0.30, ease: "power1.out" }, 8.12);

      /* Scene 5 (8.4-10.0) — locked frame, held read. Nothing moves but the caret. */
    })();
  </script>
