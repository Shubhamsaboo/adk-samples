        "#otc-sub",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.60, ease: "power3.out" },
        T_SUB
      );
      tl.fromTo(
        "#otc-chip",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.60, ease: "power3.out" },
        T_CHIP
      );

      /* ── S5 — held to the last rendered frame. The caret is the only motion.
         1.6 Hz square wave (0.3125s half-period), sampled on a 60fps grid so
         every toggle lands on a frame boundary. Pure function of time.     */
      var BLINK_HALF = 0.3125;
      var caret = el("otc-caret");
      var blinkFrom = T_CARET + 0.35;
      var drv = { t: blinkFrom };
      tl.fromTo(
        drv,
        { t: blinkFrom },
        {
          t: DURATION,
          duration: DURATION - blinkFrom,
          ease: "none",
          onUpdate: function () {
            var q = Math.round(drv.t * 60) / 60;
            caret.style.opacity = Math.floor(q / BLINK_HALF) % 2 === 0 ? "1" : "0";
          }
        },
        blinkFrom
      );
    })();
  </script>
</template>
