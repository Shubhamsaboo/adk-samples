    (function () {

      var TRANSIT_DX = 0;               // the empty host is centred, so x=960 is the layout

      /* discrete-text-sequence: sparse {t,text} states. Cadence is derived per

         index-based micro-jitter breaks the machine rhythm). No randomness. */
      function buildSeq(text, t0, t1) {

      /* one master driver — text states, caret host, blink, voltage envelope.
