    /* ── 01-text-cant-be-tapped ──────────────────────────────────────────
       Canvas 1920x1080. Tokens from frame.md (Composer Dark — Frame).
       canvas #07080B · ink #EDF1F8 · ink-faint #4A5364 · stream #5B8CFF · live #34E2C0
       Left rail x=730 (38%). Reply lines at `lead` (2.08cqw = 40px / lh 58px).
       ------------------------------------------------------------------ */

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: none;
      font-family: 'Inter', sans-serif;

    /* ── the film's floor: void + 48px lattice, radially masked. Never animates. ── */
    .tct-ground {
      position: absolute;
      inset: 0;
      background-color: #07080B;
    }
    .tct-lattice {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(to right, rgba(237, 241, 248, 0.04) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(to bottom, rgba(237, 241, 248, 0.04) 0 1px, transparent 1px 48px);
      -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 50%, #000 35%, transparent 100%);
      mask-image: radial-gradient(ellipse 70% 62% at 50% 50%, #000 35%, transparent 100%);
    }

    /* ── chrome: bottom status strip (mono-label, ink-faint) ── */
    .tct-status {
      position: absolute;
      left: 80px;

      top: 936px;

    /* verdict — kicker-index form: mono, uppercase, tracked, live square prefix */
    .tct-verdict {

    /* offscreen probe — never visible, used only to keep measurement honest */
    .tct-probe {
      position: absolute;

      visibility: hidden;
    }

  <div id="root" data-composition-id="01-text-cant-be-tapped">
    <!-- the film's floor: identical in every frame, full duration, never animated -->
    <div class="clip tct-ground" data-start="0" data-duration="8" data-track-index="0">
      <div class="tct-lattice"></div>
    </div>

    <!-- chrome -->
    <div class="clip tct-status" data-start="0" data-duration="8" data-track-index="1">
      <span>A2UI · AGENT-DRIVEN INTERFACES</span>
      <span>01 / 06</span>
    </div>

    <!-- content -->
    <div class="clip tct-stage" data-start="0" data-duration="8" data-track-index="2">
      <span class="tct-line tct-line-1" id="tct-line-1"></span>
      <span class="tct-line tct-line-2" id="tct-line-2"></span>

      <div class="tct-caret" id="tct-caret">
        <div class="tct-caret-in" id="tct-caret-in">
          <div class="tct-caret-bar" id="tct-caret-bar">
            <div class="tct-caret-glow" id="tct-caret-glow"></div>
          </div>
        </div>

      <div class="tct-verdict" id="tct-verdict">
        <span class="tct-mark" id="tct-mark"></span><span class="tct-word"

        ><span class="tct-word"
          ><span class="tct-word-in" data-word="cant">CAN’T </span></span
        ><span class="tct-word"
          ><span class="tct-word-in" data-word="be">BE </span></span
        ><span class="tct-word"
          ><span class="tct-word-in" data-word="tapped">TAPPED</span></span
        >
      </div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "01-text-cant-be-tapped";
      var DURATION = 8;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[FRAME_ID] = tl;

      /* ── geometry ─────────────────────────────────────────────── */
      var RAIL_X = 730;        // 38% of 1920
      var LINE_H = 58;
      var L1_TOP = 547;
      var L2_TOP = 605;
      var CARET_IN_LINE = 7;   // 44px bar centred in a 58px line box
      var REST_X = 960;        // handoff: 50% of canvas width
      var REST_Y = 669.6;      // handoff: 62% of canvas height

      /* ── copy ─────────────────────────────────────────────────── */
      var LINE_1 = "Flight AA 2417 is delayed 40 minutes.";
      var LINE_2 = "You can rebook, change seats, or add a bag.";

      /* ── scene windows (120 BPM grid, 0.5s beat) ──────────────── */
      var T1_IN = 0.5,  T1_OUT = 2.4;   // scene 1 — line 1 types
      var T2_IN = 2.6,  T2_OUT = 4.85;  // scene 2 — line 2 types
      var T_VERDICT = 5.0;              // scene 3 — desaturate + verdict
      var T_MOVE_IN = 5.0, T_MOVE_DUR = 0.8; // caret walks to its rest position

      /* ── discrete-text-sequence: sparse {t,text} states ────────
         Cadence is derived per character (spaces breathe, punctuation
         breathes more, a fixed index-based micro-jitter breaks the
         machine rhythm). Deterministic — no Math.random anywhere. */
      function buildSeq(text, t0, t1) {
        var gaps = [];
        for (var i = 0; i < text.length - 1; i++) {
          var c = text.charAt(i);
          var g = 1;
          if (c === " ") g = 1.75;
          else if (c === "," || c === ".") g = 2.6;
          g *= 1 + ((i * 5) % 4) * 0.09;
          gaps.push(g);
        }
        var total = 0;
        for (var k = 0; k < gaps.length; k++) total += gaps[k];
        if (total === 0) total = 1;
        var span = t1 - t0;
        var seq = [];
        var acc = 0;
        for (var j = 0; j < text.length; j++) {
          seq.push({ t: t0 + (acc / total) * span, text: text.slice(0, j + 1) });
          if (j < gaps.length) acc += gaps[j];
        }
        return seq;
      }

      var SEQ_1 = buildSeq(LINE_1, T1_IN, T1_OUT);
      var SEQ_2 = buildSeq(LINE_2, T2_IN, T2_OUT);

      function textAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (time >= seq[i].t) return seq[i].text;
        }
        return "";
      }

      /* every state change is a keystroke — baked once, no runtime state */
      var CHANGE_TIMES = [];
      (function () {
        var all = SEQ_1.concat(SEQ_2);
        for (var i = 0; i < all.length; i++) CHANGE_TIMES.push(all[i].t);
      })();
      var TYPING_GRACE = 0.2;

      /* ── caret blink: 1.5 Hz square wave, pure function of time.
         Half-period 1/3 s lands every toggle on an even frame boundary
         at 24 / 30 / 60 fps, so the render is seek-stable. ── */
      var BLINK_HALF = 1 / 3;

      /* ── asr-keyword-glow: one envelope, one word ("TAPPED") ──── */
      var KW_START = 5.9, KW_END = 6.1;
      var ATTACK_DUR = 0.16, RELEASE = 0.38;
      var MAX_BLUR = 34, MAX_SCALE_BOOST = 0.09;

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - (time - end) / RELEASE;
        return 0;
      }

      /* ── elements ─────────────────────────────────────────────── */
      var line1El = document.getElementById("tct-line-1");
      var line2El = document.getElementById("tct-line-2");
      var caretEl = document.getElementById("tct-caret");
      var caretBar = document.getElementById("tct-caret-bar");
      var tappedEl = document.querySelector('[data-word="tapped"]');

      function setText(el, s) {
        if (el.textContent !== s) el.textContent = s;
      }

      /* ── one master driver: text, caret transit, blink, voltage ─ */
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var t = driver.t;

            /* typed reply — discrete state swaps, guarded so the DOM
               is only touched on an actual transition */
            var s1 = textAt(SEQ_1, t);
            var s2 = t >= T2_IN ? textAt(SEQ_2, t) : "";
            setText(line1El, s1);
            setText(line2El, s2);

            /* caret position: it rides the end of the active line,
               drops a line on the scene-2 cue, then walks to its
               hand-off rest point across scene 3. */
            var cx, cy;
            if (t < T2_IN) {
              cx = RAIL_X + line1El.offsetWidth;
              cy = L1_TOP + CARET_IN_LINE;
            } else {
              cx = RAIL_X + line2El.offsetWidth;
              cy = L2_TOP + CARET_IN_LINE;
            }
            if (t >= T_MOVE_IN) {
              var u = Math.min((t - T_MOVE_IN) / T_MOVE_DUR, 1);
              var p = 1 - Math.pow(1 - u, 3); // power3.out, by hand
              cx = cx + (REST_X - cx) * p;
              cy = cy + (REST_Y - cy) * p;
            }
            gsap.set(caretEl, { x: cx, y: cy });

            /* blink — solid while keys are landing, 1.5 Hz otherwise */
            var typing = false;
            for (var i = 0; i < CHANGE_TIMES.length; i++) {
              var ct = CHANGE_TIMES[i];
              if (ct <= t && t - ct < TYPING_GRACE) {
                typing = true;
                break;
              }
            }
            var lit = typing || Math.floor(t / BLINK_HALF) % 2 === 0;
            caretBar.style.opacity = lit ? "1" : "0";

            /* the frame's one voltage moment.
               Glow + scale ride the full attack/release envelope and
               decay to nothing (no permanent bloom on content); the
               colour lerps ink -> live on the attack and stays live,
               because TAPPED is the word the frame is remembered by. */
            var env = envelope(t, KW_START, KW_END);
            tappedEl.style.textShadow =
              "0 0 " + MAX_BLUR * env + "px rgba(52, 226, 192, " + 0.55 * env + ")";
            tappedEl.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
            var ce = t < KW_START ? 0 : Math.min((t - KW_START) / ATTACK_DUR, 1);
            tappedEl.style.color =
              "rgb(" +
              Math.round(237 + (52 - 237) * ce) + ", " +
              Math.round(241 + (226 - 241) * ce) + ", " +
              Math.round(248 + (192 - 248) * ce) + ")";
          },
        },
        0
      );

      /* ── scene 1: the caret arrives. Nothing else exists. ─────── */
      tl.fromTo(
        "#tct-caret-in",
        { opacity: 0, scaleY: 0.18 },
        { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" },
        0.1
      );

      /* ── scene 3: the reply dies back to ink-faint in one pass ── */
      tl.fromTo(
        [line1El, line2El],
        { color: "#EDF1F8" },
        { color: "#4A5364", duration: 0.4, ease: "power2.inOut" },
        T_VERDICT
      );

      /* the caret is no longer the active element — its bloom decays */
      tl.fromTo(
        "#tct-caret-glow",
        { opacity: 1 },
        { opacity: 0, duration: 0.6, ease: "power3.out" },
        T_VERDICT
      );

      /* ── scene 3: verdict, word by word.
         dynamic-content-sequencing — per-word windows are computed
         once at build from word length, never hardcoded per item. */
      var WORDS = ["TEXT", "CAN’T", "BE", "TAPPED"];
      var BASE_STEP = 0.17;
      var SEC_PER_CHAR = 0.022;
      var VERDICT_T0 = 5.05;
      var WORD_TIMELINE = [];
      (function () {
        var cumulative = 0;
        for (var i = 0; i < WORDS.length; i++) {
          WORD_TIMELINE.push(VERDICT_T0 + cumulative);
          cumulative += BASE_STEP + WORDS[i].length * SEC_PER_CHAR;
        }
      })();

      tl.fromTo(
        "#tct-mark",
        { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" },
        T_VERDICT
      );

      var wordEls = document.querySelectorAll("#tct-verdict .tct-word");
      for (var w = 0; w < wordEls.length; w++) {
        tl.fromTo(
          wordEls[w],
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          WORD_TIMELINE[w]
        );
      }
    })();
  </script>
</template>
