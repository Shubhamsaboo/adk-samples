    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:block;src:url(assets/fonts/JetBrainsMono-5.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

    #root{
      position:relative;
      width:1920px;
      height:1080px;
      overflow:hidden;
      font-family:'Inter',sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    /* ---------- the film's floor: void + 48px lattice, radially masked ---------- */
    #f02-ground{position:absolute;inset:0;background-color:#07080B;}
    #f02-lattice{
      position:absolute;inset:0;
      background-image:
        linear-gradient(to right, rgba(237,241,248,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(237,241,248,0.04) 1px, transparent 1px);
      background-size:48px 48px;
      background-position:0 0;
      -webkit-mask-image:radial-gradient(ellipse 70% 62% at 50% 50%, #000 35%, transparent 100%);
      mask-image:radial-gradient(ellipse 70% 62% at 50% 50%, #000 35%, transparent 100%);
    }

    /* ---------- chrome: bottom status strip (never animates) ---------- */
    #f02-status{
      position:absolute;left:80px;right:80px;top:936px;height:20px;
      display:flex;align-items:center;justify-content:space-between;
      font-family:'JetBrains Mono',monospace;font-size:19.2px;font-weight:500;
      letter-spacing:0.06em;text-transform:uppercase;line-height:1;
      color:#828A99;
    }

    /* ---------- stage ---------- */
    #f02-stage{position:absolute;inset:0;}

    /* the caret handed off from Frame 1 — x 50%, y 62% */
    #f02-caret{
      position:absolute;left:960px;top:669px;
      width:2px;height:53px;margin-left:-1px;margin-top:-26.5px;
      background:#5B8CFF;
      box-shadow:0 0 0 1px rgba(91,140,255,0.22), 0 0 44px rgba(91,140,255,0.14);
    }

    /* display beats — centred block, optical centre at y = 475 */
    .f02-beat{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding-bottom:130px;
      will-change:transform,filter,opacity;

    /* beat 2 does not exist until the cut at 2.0s — authored hidden in CSS */
    #f02-beat2{opacity:0;}
    .f02-line{
      white-space:nowrap;

    .f02-line .f02-w:last-child{margin-right:0;}

    /* the wordmark lockup — wordmark optical centre at y = 497 (46%) */
    #f02-lockup{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;
      padding-top:427px;
    }
    #f02-wordmark{
      font-family:'Inter',sans-serif;
      font-size:140px;font-weight:600;line-height:1.0;

      transform-origin:50% 50%;
      opacity:0;
      will-change:transform,opacity;
    }
    #f02-rule{display:block;margin-top:34px;}

    #f02-sub{
      margin-top:30px;
      font-family:'JetBrains Mono',monospace;font-size:19.2px;font-weight:500;
      letter-spacing:0.06em;text-transform:uppercase;line-height:1;
      color:#A3ABBB;

      opacity:0;
      will-change:transform,opacity;
    }
  </style>

  <div
    id="root"
    data-composition-id="02-describe-the-interface"
    data-start="0"
    data-duration="8.4"
    data-width="1920"
    data-height="1080"
  >
    <!-- ground: the permanent floor + chrome. Full duration, never animated. -->
    <div id="f02-ground" class="clip" data-start="0" data-duration="8.4" data-track-index="0">
      <div id="f02-lattice"></div>
      <div id="f02-status">
        <span>A2UI · AGENT-DRIVEN INTERFACES</span>
        <span>02 / 06</span>
      </div>
    </div>

    <!-- stage: type beats + wordmark lockup -->
    <div id="f02-stage" class="clip" data-start="0" data-duration="8.4" data-track-index="1">
      <div id="f02-caret"></div>

      <div id="f02-beat1" class="f02-beat">
        <div class="f02-line"><span class="f02-w">Describe</span></div>
        <div class="f02-line"><span class="f02-w">the</span><span class="f02-w">interface.</span></div>
      </div>

      <div id="f02-beat2" class="f02-beat">
        <div class="f02-line"><span class="f02-w">The</span><span class="f02-w">agent</span></div>
        <div class="f02-line"><span class="f02-w">streams</span><span class="f02-w">it</span><span class="f02-w">in.</span></div>
      </div>

      <div id="f02-lockup">
        <div id="f02-wordmark">A2UI Composer</div>
        <svg id="f02-rule" width="920" height="2" viewBox="0 0 920 2" xmlns="http://www.w3.org/2000/svg">
          <path id="f02-rulepath" d="M 0 1 L 920 1"></path>
        </svg>
        <div id="f02-sub">THE VISUAL WORKBENCH FOR A2UI</div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var caret = document.getElementById("f02-caret");
      var beat1 = document.getElementById("f02-beat1");
      var beat2 = document.getElementById("f02-beat2");
      var w1 = beat1.querySelectorAll(".f02-w");
      var w2 = beat2.querySelectorAll(".f02-w");
      var wordmark = document.getElementById("f02-wordmark");
      var rulePath = document.getElementById("f02-rulepath");
      var sub = document.getElementById("f02-sub");

      // measured geometry for the hairline draw
      var ruleLen = rulePath.getTotalLength();
      rulePath.style.strokeDasharray = String(ruleLen);
      rulePath.style.strokeDashoffset = String(ruleLen);

      var CUT = 2.0;          // beat 1 -> beat 2, the waterfall cut
      var TRAVEL = 230;       // ~12% of 1920
      var TEXT_BLUR = 10;     // size-scaled blur: text scale

      /* ---------- build-time state : only the grid, the inherited caret and beat 1 exist ---------- */
      // immediate (outside the timeline) so frame 0 is already correct
      gsap.set(caret, { opacity: 1 });
      gsap.set(beat1, { y: 0, filter: "blur(0px)" });
      gsap.set(w1, { x: 0, opacity: 1 });
      gsap.set(beat2, { y: 0, filter: "blur(" + TEXT_BLUR + "px)" });
      gsap.set(w2, { x: TRAVEL, opacity: 0.35 });
      gsap.set(wordmark, { scale: 1.06 });
      gsap.set(sub, { y: 14 });

      /* ---------- Scene 1 (0.0-2.0) : caret blinks out, beat 1 holds ---------- */
      var cd = { t: 0 };
      tl.to(
        cd,
        {
          t: 0.5,
          duration: 0.5,
          ease: "none",
          onUpdate: function () {
            var t = cd.t;
            var env = 1 - t / 0.5;                                  // fade envelope
            var on = Math.cos(2 * Math.PI * 1.6 * t) >= 0 ? 1 : 0;  // 1.6Hz blink
            caret.style.opacity = String(env * on);
          }
        },
        0
      );
      tl.set(caret, { opacity: 0 }, 0.5);

      /* ---------- Scene 2 (2.0-4.0) : waterfall cut, beat 1 -> beat 2 ---------- */
      // exit: each word ramps left on power4.in, fading out before the cut
      var EXIT_DUR = 0.34;
      var exitBase = CUT - EXIT_DUR;
      for (var i = 0; i < w1.length; i++) {
        var at = exitBase + i * 0.022;
        tl.fromTo(
          w1[i],
          { x: 0 },
          { x: -TRAVEL, duration: EXIT_DUR, ease: "power4.in", immediateRender: false },
          at
        );
        tl.fromTo(
          w1[i],
          { opacity: 1 },
          { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false },
          at + 0.06
        );
      }
      tl.fromTo(
        beat1,
        { filter: "blur(0px)" },
        { filter: "blur(" + TEXT_BLUR + "px)", duration: EXIT_DUR, ease: "power4.in", immediateRender: false },
        exitBase
      );
      // the hard cut — no crossfade, the swap IS the beat
      tl.set(beat1, { opacity: 0 }, CUT);
      tl.set(beat2, { opacity: 1 }, CUT);

      // entry: mirrored power4.out, waterfall stagger with shrinking gaps
      var gap = 0.05;
      var acc = 0;
      for (var j = 0; j < w2.length; j++) {
        if (j > 0) {
          acc += gap;
          gap *= 0.84;
        }
        tl.fromTo(
          w2[j],
          { x: TRAVEL, opacity: 0.35 },
          { x: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false },
          CUT + acc
        );
      }
      tl.fromTo(
        beat2,
        { filter: "blur(" + TEXT_BLUR + "px)" },
        { filter: "blur(0px)", duration: 0.42, ease: "power4.out", immediateRender: false },
        CUT
      );

      /* ---------- Scene 3 (4.0-6.0) : beat 2 clears up, the wordmark forms ---------- */
      tl.fromTo(
        beat2,
        { y: 0, filter: "blur(0px)" },
        {
          y: -140,
          filter: "blur(" + TEXT_BLUR + "px)",
          duration: 0.3,
          ease: "power4.in",
          immediateRender: false
        },
        4.0
      );
      tl.fromTo(
        w2,
        { opacity: 1 },
        { opacity: 0, duration: 0.24, ease: "power2.in", immediateRender: false },
        4.0
      );

      // wordmark: settles from a 6% scale-up on a long-tail power3 settle (no overshoot)
      tl.fromTo(
        wordmark,
        { scale: 1.06, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out", immediateRender: false },
        4.12
      );

      // hairline rule draws on beneath it, left to right
      tl.fromTo(
        rulePath,
        { strokeDashoffset: ruleLen },
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out", immediateRender: false },
        4.42
      );

      // mono sub-line reveals under the rule
      tl.fromTo(
        sub,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out", immediateRender: false },
        4.7
      );

      /* ---------- Scene 4 (6.0-8.0) : held beat. Completely still. ---------- */
      tl.to({ hold: 0 }, { hold: 1, duration: 8, ease: "none" }, 0);

      window.__timelines["02-describe-the-interface"] = tl;
    })();
  </script>
